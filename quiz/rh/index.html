<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 🌐 Pas de traduction automatique : les noms des gagnants et les libellés
     des récompenses ne doivent jamais être réécrits par le navigateur. -->
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>Famiformation — Récompenses RH</title>
<style>
  :root { --pousse:#1E7A46; --foret:#0E3B24; --brume:#eef4ef; --craie:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--brume); color:var(--foret);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; padding:18px 14px 60px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 2px; color:var(--pousse); }
  .sub { color:#5a6b60; margin:0 0 16px; font-size:.95rem; }
  .card { background:var(--craie); border-radius:16px; padding:18px 18px; margin-bottom:16px;
    box-shadow:0 6px 20px rgba(14,59,36,.08); border:1px solid #e6efe8; }
  .field { width:100%; padding:12px 14px; border:2px solid #cfe0d4; border-radius:12px; font-size:1rem; margin:6px 0 12px; }
  .btn { border:none; cursor:pointer; background:var(--pousse); color:#fff; font-weight:700;
    padding:12px 20px; border-radius:999px; font-size:1rem; }
  .btn.ghost { background:#fff; color:var(--foret); border:2px solid var(--pousse); }
  .btn:disabled { opacity:.5; cursor:default; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .top .spacer { flex:1; }
  .site-switch { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .ss-btn { border:2px solid var(--pousse); background:#fff; color:var(--foret); border-radius:999px;
    padding:8px 16px; font-weight:700; cursor:pointer; }
  .ss-btn.on { background:var(--pousse); color:#fff; }
  .sec-titre { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 10px; }
  .sec-titre h2 { font-size:1.15rem; margin:0; color:var(--foret); }
  .compte { font-size:.9rem; color:#5a6b60; font-weight:700; }
  .rh-row { display:flex; align-items:center; gap:12px; padding:11px 8px; border-top:1px solid #eef2ee; }
  .rh-row:first-of-type { border-top:none; }
  .rh-row.remis { background:#f2faf4; }
  .rh-rang { flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:#eef4ef; color:var(--pousse);
    font-weight:800; display:flex; align-items:center; justify-content:center; font-size:.95rem; }
  .rh-rang.or { background:#F7C13A; color:#5a4300; } .rh-rang.argent { background:#d7dde1; color:#333; }
  .rh-rang.bronze { background:#e6b98a; color:#5a3a17; }
  .rh-info { flex:1; min-width:0; }
  .rh-nom { font-weight:700; }
  .rh-meta { font-size:.85rem; color:#7a8a80; }
  .rh-mail-ligne { margin-top:3px; font-size:.85rem; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .rh-pick { flex:none; display:flex; align-items:center; padding-right:4px; }
  .rh-pick input { width:18px; height:18px; cursor:pointer; }
  .rh-pick input:disabled { cursor:not-allowed; opacity:.4; }
  /* 🧪 Ligne d'essai : violette et rayée, impossible a confondre avec un gagnant. */
  .rh-row.rh-test { background:repeating-linear-gradient(45deg,#f6f1fb,#f6f1fb 10px,#efe7f7 10px,#efe7f7 20px);
    border-left:4px solid #8b5cf6; }
  .rh-row.rh-test .rh-nom { color:#5b21b6; }
  .rh-badge-test { background:#8b5cf6; color:#fff; border-radius:999px; padding:1px 9px;
    font-size:.7rem; font-weight:800; letter-spacing:.06em; vertical-align:middle; }
  .rh-rang-test { font-size:1.3rem; }
  .rh-check-vide { color:#b8a8cc; font-weight:800; padding:0 18px; }
  .aide-envoi { background:#f2faf4; border:1px solid #cfe6d5; border-radius:12px;
    padding:11px 15px; margin:0 0 14px; font-size:.9rem; line-height:1.6; }
  .rh-envois { font-size:.8rem; font-weight:700; display:inline-flex; gap:6px; flex-wrap:wrap; }
  .rh-envois.rh-jamais { color:#8a968f; background:#f2f4f3; border-radius:999px; padding:2px 9px; font-weight:600; }
  .rh-part { border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .rh-part-att { color:#8a5b00; background:#fdf0d5; }
  .rh-part-prete { color:#1E7A46; background:#e7f6ea; }
  .rh-part-ancien { color:#6b7280; background:#f1f2f4; font-weight:600; }
  .rh-barre { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; font-size:.86rem; }
  .rh-lien { background:none; border:none; padding:0; font:inherit; color:#2d5a37; font-weight:700; text-decoration:underline; cursor:pointer; }
  .rh-compteur { margin-left:auto; color:#7a8a80; }
  .rh-mail { color:#2d5a37; font-weight:600; text-decoration:none; word-break:break-all; }
  .rh-mail:hover { text-decoration:underline; }
  .rh-sansmail { color:#a12; font-weight:600; }
  .rh-check { flex:0 0 auto; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-weight:700; color:#5a6b60; font-size:.9rem; }
  .rh-check input { width:26px; height:26px; accent-color:var(--pousse); cursor:pointer; }
  .rh-check.on { color:var(--pousse); }
  .vide { color:#8a988f; padding:10px 4px; font-style:italic; }
  .msg { padding:10px 14px; border-radius:10px; margin-bottom:12px; font-weight:600; }
  .msg.err { background:#fdecec; color:#a12; } .msg.ok { background:#eaf7ec; color:#1E7A46; }
  .hint { color:#7a8a80; font-size:.85rem; }
/* --- Stock de bons cadeaux et onglets --- */
.stock{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#fff;border-radius:14px;
       padding:14px 18px;margin:14px 0;box-shadow:0 3px 12px rgba(0,0,0,.07);border-left:5px solid #3f9d57;}
.stock.bas{border-left-color:#d6a21a;}
.stock.vide{border-left-color:#c0392b;}
.stock .st-b{display:flex;flex-direction:column;line-height:1.15;padding-right:16px;}
.stock .st-b b{font-size:26px;font-weight:900;color:#1f5c34;}
.stock .st-b span{font-size:12px;font-weight:700;color:#5c6f60;text-transform:uppercase;letter-spacing:.04em;}
.stock .st-msg{flex:1;min-width:220px;font-size:13.5px;font-weight:600;color:#8a5f2a;}
.stock.vide .st-msg{color:#a8341f;}
.onglets{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.onglets .ong{border:0;background:#fff;color:#5c6f60;font-weight:700;font-size:13.5px;padding:9px 16px;
              border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.onglets .ong.on{background:#1f5c34;color:#fff;}
.rd-tab{width:100%;border-collapse:collapse;}
.rd-tab th,.rd-tab td{padding:10px 12px;text-align:left;font-size:13.5px;border-bottom:1px solid #eef2ee;vertical-align:top;}
.rd-tab th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#1f5c34;white-space:nowrap;}
.rd-tab tr:last-child td{border-bottom:0;}
.rd-date{color:#5c6f60;font-size:12.5px;white-space:nowrap;}
.rd-mail{font-size:12px;color:#5c6f60;}
.rd-code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;}
.rd-vide{text-align:center;color:#5c6f60;padding:28px 10px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const API = "../api.php";
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const SITES = { mouscron:"Famiflora Mouscron", lapanne:"Famiflora La Panne" };

let auth = null;
try { auth = JSON.parse(localStorage.getItem("fj_rh_auth") || "null"); } catch (e) {}
let site = localStorage.getItem("fj_rh_site") || "mouscron";
let data = null;
// 🎟️ État du stock de bons cadeaux + la liste de ceux déjà donnés.
// Chargé à part de rh_liste : si la base est indisponible, on perd l'onglet,
// pas l'accès à la page.
let recomp = null;
let onglet = "remettre";

async function post(action, corps = {}) {
  const r = await fetch(`${API}?action=${action}`, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ ...(auth || {}), site, ...corps }),
  });
  let d = null; try { d = await r.json(); } catch { d = null; }
  return { ok:r.ok, status:r.status, data:d };
}

function vueLogin(err) {
  $("#app").innerHTML = `
    <h1>🎁 Récompenses — accès RH</h1>
    <p class="sub">Connecte-toi pour voir qui doit recevoir une récompense.</p>
    <div class="card" style="max-width:420px;">
      ${err ? `<div class="msg err">${esc(err)}</div>` : ""}
      <label>Identifiant</label>
      <input class="field" id="lg-id" autocomplete="username" placeholder="Identifiant">
      <label>Mot de passe</label>
      <input class="field" id="lg-pwd" type="password" autocomplete="current-password" placeholder="Mot de passe">
      <button class="btn" id="lg-ok" style="width:100%;">Se connecter</button>
    </div>`;
  const go = async () => {
    const id = $("#lg-id").value.trim(), pwd = $("#lg-pwd").value;
    if (!id || !pwd) return;
    auth = { id, pwd };
    const r = await post("rh_liste");
    if (r.status === 401) { auth = null; vueLogin("Identifiant ou mot de passe incorrect."); return; }
    if (!r.ok || !r.data || !r.data.ok) { auth = null; vueLogin("Connexion impossible, réessaie."); return; }
    localStorage.setItem("fj_rh_auth", JSON.stringify(auth));
    data = r.data; rendre();
  };
  $("#lg-ok").addEventListener("click", go);
  $("#lg-pwd").addEventListener("keydown", (e) => e.key === "Enter" && go());
}

function nomAffiche(p) {
  const nn = `${p.prenom || ""} ${p.nom || ""}`.trim();
  return nn || p.pseudo || p.name;
}
function ligneHtml(p, type, rangClass) {
  const remis = !!p.remis;
  const rang = type === "podium" ? `<div class="rh-rang ${rangClass}">${p.rang}</div>` : `<div class="rh-rang">🎁</div>`;
  const meta = [];
  if (p.pseudo && p.pseudo !== nomAffiche(p)) meta.push("pseudo : " + esc(p.pseudo));
  meta.push(esc(String(p.score)) + " 🌰");
  if (p.name) meta.push("id : " + esc(p.name));
  // 📧 L'adresse, cliquable pour ecrire directement. Sans adresse, on le DIT :
  // cette personne ne peut pas recevoir le mail « viens chercher ta recompense »,
  // il faut donc la prevenir autrement.
  // 📨 Compteur d'envois, par modele. Il remplace l'ancien verrou « une seule
  // fois » : on peut renvoyer autant qu'on veut, et on sait ce qui est deja parti.
  // 📨 CE QUI EST DÉJÀ PARTI, en toutes lettres. L'ancien affichage montrait
  // « ⏳ 1 · 🎁 2 » : il fallait deviner. Et surtout, le mail AUTOMATIQUE (jardin
  // terminé, podium) n'était pas compté du tout — la ligne disait « aucun mail
  // envoyé » alors que la personne avait bien été prévenue.
  // 🎯 LES COMPTEURS SONT PROPRES À CETTE RÉCOMPENSE-LÀ. Quelqu'un peut être au
  // podium ET avoir fini son jardin : ce sont deux récompenses, deux mails. On
  // nomme donc la récompense dans chaque étiquette, sinon on croit avoir
  // prévenu la personne pour son podium alors que le mail parlait du jardin.
  const quoi = p.motif === "jardin" ? "jardin" : "podium";
  const quand = p.dernier ? " — dernier envoi le " + esc(p.dernier.slice(0, 16).replace("T", " à ")) : "";
  const bouts = [];
  if (p.nb_attente) {
    bouts.push(`<span class="rh-part rh-part-att">⏳ « on prépare » <b>${quoi}</b> envoyé${p.nb_attente > 1 ? " ×" + p.nb_attente : ""}`
      + `${p.origine === "auto" && p.nb_attente === 1 ? " (automatique)" : ""}</span>`);
  }
  if (p.nb_prete) {
    bouts.push(`<span class="rh-part rh-part-prete">🎁 « c'est prêt » <b>${quoi}</b> envoyé${p.nb_prete > 1 ? " ×" + p.nb_prete : ""}</span>`);
  }
  // 📜 Plus d'historique « sans motif » à afficher : les envois d'avant la
  // séparation ont été rangés côté serveur dans le compteur du JARDIN — ce sont
  // tous des mails de jardin terminé, le mail automatique du podium ne partant
  // qu'après l'annonce des résultats.
  if (!bouts.length) {
    bouts.push(`<span class="rh-envois rh-jamais">✉️ aucun mail « ${quoi} » envoyé</span>`);
  }
  const envois = `<span class="rh-envois" title="${esc(quand.replace(/^ — /, ""))}">${bouts.join(" ")}</span>`;
  // 🧪 COMPTE DE TEST (admin_…). Il ne compte PAS au classement et ne prend la
  // place de personne : il n'est là que pour essayer un envoi de mail. On le
  // rend visuellement impossible à confondre avec un vrai gagnant — sinon on
  // finit par lui « remettre » une récompense qui n'existe pas.
  const estTest = !!p.test;
  return `<div class="rh-row ${remis ? "remis" : ""} ${estTest ? "rh-test" : ""}" data-name="${esc(p.name)}" data-type="${type}">
    <label class="rh-pick"><input type="checkbox" class="rh-cb" value="${esc(String(p.name || "").toLowerCase())}" disabled></label>
    ${estTest ? `<span class="rh-rang rh-rang-test" title="Compte de test">🧪</span>` : rang}
    <div class="rh-info">
      <div class="rh-nom">${esc(nomAffiche(p))}${estTest ? ` <span class="rh-badge-test">TEST</span>` : ""}</div>
      <div class="rh-meta">${estTest
        ? `<b>Compte d'essai — ne compte pas au classement.</b> Coche-le ici pour recevoir la version
           <b>${type === "podium" ? "podium (comme un 1<sup>er</sup>)" : "jardin terminé"}</b> du mail, et voir exactement ce que reçoit un gagnant.`
        : meta.join(" · ")}</div>
      <div class="rh-mail-ligne"><span class="rh-mail-zone"><span class="rh-mail rh-jamais">adresse…</span></span> ${envois}</div>
    </div>
    ${estTest ? `<span class="rh-check-vide" title="Rien à remettre : ce n'est pas un vrai gagnant">—</span>` : `
    <label class="rh-check ${remis ? "on" : ""}">
      <input type="checkbox" ${remis ? "checked" : ""}>
      <span>${remis ? "Remis ✅" : "À remettre"}</span>
    </label>`}
  </div>`;
}

function sectionHtml(titre, emoji, liste, type) {
  // Le compteur « X/Y remis » ne parle que des VRAIS gagnants : un compte de
  // test dans le total ferait croire qu'il reste une récompense à remettre.
  const vrais = liste.filter((p) => !p.test);
  const nbRemis = vrais.filter((p) => p.remis).length;
  const rows = liste.length
    ? liste.map((p, i) => ligneHtml(p, type, type === "podium" ? ["or","argent","bronze"][i] || "" : "")).join("")
    : `<div class="vide">Personne pour l'instant.</div>`;
  return `<div class="card">
    <div class="sec-titre">
      <h2>${emoji} ${titre}</h2>
      <span class="compte">${nbRemis}/${vrais.length} remis</span>
    </div>
    ${rows}
  </div>`;
}

// 🎟️ Les deux chiffres du stock, tout en haut. Le nombre de bons restants est
// l'information la plus utile de la page : sans bon, le mail « ta récompense
// est prête » ne part plus du tout.
function stockHtml() {
  if (!recomp) return "";
  const libres = Number(recomp.libres || 0);
  const donnes = Number(recomp.donnes || 0);
  const alerte = libres === 0 ? "vide" : (libres <= 3 ? "bas" : "");
  return `
    <div class="stock ${alerte}">
      <div class="st-b"><b>${libres}</b><span>code${libres > 1 ? "s" : ""} restant${libres > 1 ? "s" : ""}</span></div>
      <div class="st-b"><b>${donnes}</b><span>déjà donné${donnes > 1 ? "s" : ""}</span></div>
      ${libres === 0
        ? `<div class="st-msg">⚠️ Plus aucun bon : le mail « ta récompense est prête » ne partira pas tant que le stock n'est pas rechargé.</div>`
        : (libres <= 3 ? `<div class="st-msg">Le stock devient bas.</div>` : "")}
    </div>`;
}

function ongletsHtml() {
  return `
    <div class="onglets">
      <button class="ong ${onglet === "remettre" ? "on" : ""}" data-ong="remettre">🎁 À remettre</button>
      <button class="ong ${onglet === "donnees" ? "on" : ""}" data-ong="donnees">🎟️ Récompenses données${recomp ? ` (${Number(recomp.donnes || 0)})` : ""}</button>
    </div>`;
}

// La liste des bons déjà attribués. Le magasin figure sur chaque ligne : le
// stock est commun aux deux, un bon donné à Mouscron est un bon en moins pour
// La Panne.
function vueDonnees() {
  const lignes = (recomp && recomp.lignes) || [];
  const corps = lignes.length
    ? lignes.map((l) => {
        const quand = l.attribue_le ? new Date(l.attribue_le.replace(" ", "T")) : null;
        const q = quand && !isNaN(quand) ? quand.toLocaleString("fr-BE", { dateStyle:"short", timeStyle:"short" }) : "";
        return `<tr>
          <td class="rd-date">${esc(q)}</td>
          <td><b>${esc(l.attribue_nom || l.attribue_a || "")}</b><div class="rd-mail">${esc(l.attribue_email || "")}</div></td>
          <td>${esc(SITES[l.site] || l.site || "—")}</td>
          <td>${l.motif === "podium" ? "🏆 Podium" : (l.motif === "jardin" ? "🌼 Jardin" : "—")}</td>
          <td class="rd-code">${esc(l.barcode || "")}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="5" class="rd-vide">Aucun bon donné pour l'instant.</td></tr>`;
  return `
    <div class="card">
      <table class="rd-tab">
        <thead><tr><th>Quand</th><th>Qui</th><th>Magasin</th><th>Motif</th><th>Code</th></tr></thead>
        <tbody>${corps}</tbody>
      </table>
    </div>`;
}

function rendre() {
  if (onglet === "donnees") {
    $("#app").innerHTML = `
      <h1>🎟️ Récompenses données</h1>
      <p class="sub">Qui a reçu un bon, lequel, et quand.</p>
      ${stockHtml()}
      ${ongletsHtml()}
      <div class="top">
        <button class="btn ghost" id="rafraichir">🔄 Rafraîchir</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="deco">Se déconnecter</button>
      </div>
      <div id="msg"></div>
      ${vueDonnees()}`;
    $("#rafraichir").addEventListener("click", charger);
    $("#deco").addEventListener("click", () => { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin(); });
    document.querySelectorAll(".ong").forEach((b) => b.addEventListener("click", () => {
      onglet = b.dataset.ong; rendre();
    }));
    return;
  }
  $("#app").innerHTML = `
    <h1>🎁 Récompenses à remettre</h1>
    <p class="sub">Coche chaque personne <b>quand tu lui as remis sa récompense</b>. Enregistré automatiquement.</p>
    ${stockHtml()}
    ${ongletsHtml()}
    <div class="site-switch">
      <span style="font-weight:700;">🏬 Magasin :</span>
      ${Object.entries(SITES).map(([k,l]) => `<button class="ss-btn ${site===k?"on":""}" data-site="${k}">${l}</button>`).join("")}
    </div>
    <div class="aide-envoi">
      📨 <b>Pour écrire à quelqu'un</b> : coche la <b>case à gauche de son nom</b>, puis choisis le mail à envoyer.
      Tu peux en cocher plusieurs. <b>Les personnes sans adresse e-mail ne sont pas cochables</b> — à prévenir de vive voix.
      Chaque ligne indique <b>ce qui lui est déjà parti</b>.
    </div>
    <div class="top">
      <button class="btn ghost" id="rafraichir">🔄 Rafraîchir</button>
      <button class="btn" id="mail-attente">⏳ « On prépare ta récompense »</button>
      <button class="btn" id="mail-prete" style="background:#d6a21a;">🎁 « Ta récompense est prête »</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="deco">Se déconnecter</button>
    </div>
    <div class="rh-barre">
      <button type="button" class="rh-lien" id="pick-tous">Tout cocher</button> ·
      <button type="button" class="rh-lien" id="pick-rien">Tout décocher</button>
      <span class="rh-compteur" id="pick-nb"></span>
    </div>
    <div id="msg"></div>
    ${sectionHtml("Jardin terminé", "🌼", data.jardin || [], "jardin")}
    ${sectionHtml("Podium (top 3)", "🏆", data.podium || [], "podium")}
    <p class="hint">🌼 Jardin terminé = grille pleine + les 3 lotus (bronze, argent, or). 🏆 Podium = les 3 meilleures récoltes.</p>`;

  document.querySelectorAll(".ong").forEach((b) => b.addEventListener("click", () => {
    onglet = b.dataset.ong; rendre();
  }));
  document.querySelectorAll(".ss-btn").forEach((b) => b.addEventListener("click", async () => {
    if (site === b.dataset.site) return;
    site = b.dataset.site; localStorage.setItem("fj_rh_site", site);
    await charger();
  }));
  $("#rafraichir").addEventListener("click", charger);
  $("#deco").addEventListener("click", () => { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin(); });
  // Sélection des destinataires. Les personnes sans adresse ont leur case
  // désactivée : les cocher ne servirait à rien, autant que ça se voie.
  const cases = () => Array.from(document.querySelectorAll(".rh-cb:not([disabled])"));
  function majNb() {
    const n = cases().filter((c) => c.checked).length;
    $("#pick-nb").textContent = n ? `${n} personne(s) sélectionnée(s)` : "aucune sélection";
  }
  $("#pick-tous").addEventListener("click", () => { cases().forEach((c) => (c.checked = true)); majNb(); });
  $("#pick-rien").addEventListener("click", () => { cases().forEach((c) => (c.checked = false)); majNb(); });
  document.querySelectorAll(".rh-cb").forEach((c) => c.addEventListener("change", majNb));
  majNb();

  // Un seul envoi possible : celui des personnes COCHÉES, avec le modèle choisi.
  async function envoyer(modele, bouton, libelle) {
    const cochees = cases().filter((c) => c.checked);
    // 🎯 D'OÙ vient chaque case : « podium » ou « jardin ». Le compte d'essai
    // figure dans les deux listes ; sans cette information, cocher sa ligne du
    // podium envoyait quand même le mail « jardin terminé ». Pour les vrais
    // gagnants, ça ne change rien : leur motif est celui qui leur revient.
    const sections = {};
    cochees.forEach((c) => {
      const row = c.closest(".rh-row");
      if (row && !sections[c.value]) sections[c.value] = row.dataset.type;
    });
    const ids = [...new Set(cochees.map((c) => c.value))];
    if (!ids.length) { $("#msg").innerHTML = `<div class="msg err">Coche d'abord les personnes à prévenir.</div>`; return; }
    const quoi = modele === "prete" ? "« ta récompense est prête »" : "« on prépare ta récompense »";
    if (!confirm(`Envoyer le mail ${quoi} à ${ids.length} personne(s) ?\n\nTu peux le renvoyer autant de fois que nécessaire.`)) return;
    const b = $(bouton); const texte = b.textContent;
    b.disabled = true; b.textContent = "Envoi…";
    const r = await post("rh_mail", { ids, modele, sections });
    b.disabled = false; b.textContent = texte;
    if (r.status === 401) { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin("Session expirée, reconnecte-toi."); return; }
    if (!r.ok || !r.data || !r.data.ok) { $("#msg").innerHTML = `<div class="msg err">${(r.data && r.data.reason === "base_indisponible") ? "Base injoignable, réessaie plus tard." : "Envoi impossible, réessaie."}</div>`; return; }
    const d = r.data;
    $("#msg").innerHTML = `<div class="msg ok">✅ ${d.envoye} mail(s) ${libelle} envoyé(s)`
      + (d.sans_mail ? ` · ${d.sans_mail} sans e-mail` : "")
      + (d.echec ? ` · ⚠️ ${d.echec} échec(s)` : "") + `.</div>`;
    await charger();   // les compteurs doivent refléter l'envoi tout de suite
  }
  $("#mail-attente").addEventListener("click", () => envoyer("attente", "#mail-attente", "« on prépare »"));
  $("#mail-prete").addEventListener("click", () => envoyer("prete", "#mail-prete", "« c'est prêt »"));

  chargeAdresses();   // les adresses arrivent après : la page est déjà utilisable

  // ⚠️ Cibler .rh-check ET NON « .rh-row input » : depuis l'ajout des cases de
  // sélection, « .rh-row input » attrapait AUSSI celles-ci. Cocher quelqu'un pour
  // lui écrire enregistrait donc sa récompense comme déjà remise.
  document.querySelectorAll(".rh-check input").forEach((inp) => inp.addEventListener("change", async (e) => {
    const row = e.target.closest(".rh-row");
    const name = row.dataset.name, type = row.dataset.type, remis = e.target.checked;
    e.target.disabled = true;
    const r = await post("rh_cocher", { type, name, remis });
    e.target.disabled = false;
    if (r.status === 401) { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin("Session expirée, reconnecte-toi."); return; }
    if (!r.ok || !r.data || !r.data.ok) { e.target.checked = !remis; $("#msg").innerHTML = `<div class="msg err">Impossible d'enregistrer, réessaie.</div>`; return; }
    // Met à jour l'état local + l'affichage de la ligne, sans tout recharger.
    const liste = (type === "podium" ? data.podium : data.jardin) || [];
    const item = liste.find((p) => p.name === name); if (item) item.remis = remis;
    rendre();
  }));
}

// 📧 Les adresses arrivent APRÈS l'affichage, par une requête à part. La page
// reste donc utilisable même si la base est injoignable : on ne perd que les
// adresses, jamais l'accès. On les injecte ensuite dans les lignes déjà là.
let adresses = {};
async function chargeAdresses() {
  const ids = [...(data.podium || []), ...(data.jardin || [])]
    .map((p) => String(p.name || "").toLowerCase()).filter(Boolean);
  if (!ids.length) return;
  const r = await post("rh_adresses", { ids }).catch(() => null);
  if (!r || !r.ok || !r.data || !r.data.ok) return;   // silencieux : rien de vital
  adresses = r.data.adresses || {};
  document.querySelectorAll(".rh-row").forEach((row) => {
    const cle = String(row.dataset.name || "").toLowerCase();
    const mail = adresses[cle] || "";
    const zone = row.querySelector(".rh-mail-zone");
    if (zone) {
      zone.innerHTML = mail
        ? `<a class="rh-mail" href="mailto:${esc(mail)}">${esc(mail)}</a>`
        : `<span class="rh-mail rh-sansmail">aucune adresse — à prévenir de vive voix</span>`;
    }
    // Sans adresse, cocher la personne ne servirait a rien.
    const cb = row.querySelector(".rh-cb");
    if (cb) { cb.disabled = !mail; }
  });
}

async function charger() {
  const r = await post("rh_liste");
  if (r.status === 401) { auth = null; localStorage.removeItem("fj_rh_auth"); vueLogin("Session expirée, reconnecte-toi."); return; }
  if (!r.ok || !r.data || !r.data.ok) { $("#msg") && ($("#msg").innerHTML = `<div class="msg err">Chargement impossible, réessaie.</div>`); return; }
  data = r.data;
  // Le stock de bons se charge à part et sans bloquer : s'il échoue, la page
  // reste utilisable, seuls les compteurs et l'onglet manquent.
  try {
    const c = await post("rh_recompenses");
    recomp = (c.ok && c.data && c.data.ok) ? c.data : null;
  } catch (e) { recomp = null; }
  rendre();
}

if (auth) { charger(); } else { vueLogin(); }
</script>
</body>
</html>
